[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    ".venv",
    "media",
    "private_media",
    "staticfiles",
    "src/*/migrations",
]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "DJ",
    "E",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501",   # длинные строки и URL контролируем форматтером и ревью
    "RUF001", # кириллица в строках — норма для русскоязычного проекта
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = [
    "chat",
    "config",
    "events",
    "posts",
    "stories",
    "tasks",
    "users",
    "webpush",
]

[tool.ruff.format]
quote-style = "single"
