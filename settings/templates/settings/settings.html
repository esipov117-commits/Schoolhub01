{% extends "base.html" %}

{% block title %}Настройки — SchoolHub{% endblock %}

{% block content %}

<div class="settings-page">
<div class="card">
    <h2>Настройки</h2>
    <form method="post">
        {% csrf_token %}
        <div class="setting-row">
            <div>
                <strong>🌙 Тёмная тема</strong>
                <p>Использовать тёмное оформление сайта.</p>
            </div>
            <label class="toggle">
                <input
                    type="checkbox"
                    name="dark_mode"
                    {% if profile.dark_mode %}checked{% endif %}
                    onchange="this.form.submit()"
                >
                <span class="toggle-slider"></span>
            </label>
        </div>
    </form>
</div>
</div>
<style>
.settings-page {
    max-width: 700px;
    margin: 0 auto;
}
.settings-page .card {
    padding: 24px;
}
.settings-page h2 {
    margin-bottom: 20px;
    font-size: 22px;
}
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
}
.setting-row strong {
    font-size: 15px;
}
.setting-row p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}
.toggle {
    position: relative;
    width: 48px;
    height: 28px;
    flex-shrink: 0;
}
.toggle input {
    opacity: 0;
    width: 0;
    height: 0;
}
.toggle-slider {
    position: absolute;
    inset: 0;
    cursor: pointer;
    background: var(--border);
    border-radius: 30px;
    transition: .2s;
}
.toggle-slider::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: .2s;
}
.toggle input:checked + .toggle-slider {
    background: var(--accent);
}
.toggle input:checked + .toggle-slider::before {
    transform: translateX(20px);
}
</style>

{% endblock %}
