{% extends "base.html" %}

{% block title %}Добро пожаловать — SchoolHub{% endblock %}

{% block grid_columns %}1fr{% endblock %}

{% block extra_head %}
<style>
    .home-welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 60vh;
        text-align: center;
    }
    .home-welcome h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
    }
    .home-welcome p {
        margin: 0;
        font-size: 18px;
        color: var(--muted);
    }
</style>
{% endblock %}

{% block content %}
<section class="home-welcome">
    <h1>Добро пожаловать</h1>
    <p>{{ user.username }}</p>
</section>
{% endblock %}
